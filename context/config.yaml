# ============================================================
# Personal configuration — the ONLY place for personal values.
# Filled by /setup on first start. Every skill reads this file.
# Behaviour tuning (mail windows, section caps, keywords) lives in the skills.
# ============================================================

# Working language — set once by /setup, then fixed.
# "en" or "de". Controls everything the user sees: briefings, dashboard text,
# mail drafts, journal/status entries, chat. Package files themselves stay English.
language: "en"

user:
  name: "[YOUR NAME]"              # e.g. "Alex Miller"
  first_name: "[FIRST NAME]"       # for mail signatures ("Best, Alex")
  email: "[your.name@company.com]"
  role: "[Position/Role, Area]"    # e.g. "Head of Sales"

location:
  home_city: "[City]"              # e.g. "Munich"
  office_abbreviation: "[ABBR]"    # e.g. "MUN", "FRA", "BER"
  office_room_patterns: ["Office"] # room/location patterns in the calendar, e.g. ["MUN", "L21", "Office"]
  other_office_patterns: []        # further locations, e.g. [{prefix: "FRA", city: "Frankfurt"}]
  office_days: []                  # e.g. ["Tuesday", "Thursday"] — rest = remote by default
  timezone: "Europe/Berlin"

calendar:
  # Recurring blocks of your own that only clutter the briefing (sports, lunch, focus time, ...).
  # Add these after the first few days — whatever is listed here shows up nowhere in the dashboard.
  noise_subjects: []               # e.g. ["LUNCH", "Focus block", "Gym"]

mail:
  tag_processed: true              # mark triaged mails visibly in the mailbox, as far as the route there allows it (Outlook on Windows via COM; otherwise silently skipped, the ledger stays the actual skip mechanism)
  processed_categories: ["AI-Triaged"]   # mails carrying this category or label count as processed and are skipped
  # YOUR OWN triage patterns — they belong here, NOT in reference/mail-triage-rules.md.
  # This file is yours and survives every package update; the rules file gets replaced by it.
  # Claude fills these in itself when you say "newsletter X never interests me" or
  # "mail from Y is always important" — that is Safeguard 10, and this is where it lands.
  custom_noise_senders: []         # senders / distribution lists that are always noise
  custom_fyi_keywords: []          # subject patterns that are always just for information
  custom_vip_senders: []           # senders that always mean something needs doing

# Your own tools — self-built tools that are linked in the dashboard (tab "Workspace").
# Three lines per tool: name, purpose (a few words), url. category is optional.
# url can be anything a browser opens: localhost, a deployed address or a local path.
# The dashboard only links, it starts and loads nothing.
own_tools: []
  # - name: "Capacity calculator"
  #   purpose: "Work out utilization per week"
  #   url: "http://localhost:8080"
  #   category: "Planning"
  # - name: "Status report template"
  #   purpose: "Build the weekly report from the project data"
  #   url: "./tools/status-report/index.html"

# Equipment — what is set up on your side. Shows in the dashboard (tab "Workspace")
# under "Your equipment". Filled by /setup and editable by hand at any time.
# status: true = set up (colored symbol), false = still open (grey symbol).
inventory:

  # Connections to mail, calendar, file storage, CRM. Instructions: reference/mcp.md
  # The optional field `slot:` assigns an entry to one of the six fixed capability slots
  # in the workspace tab: mail | calendar | storage | chat | crm | dev.
  # These exact strings are the ones reference/self-test.md checks against — a different
  # spelling makes the "no mailbox, no calendar" check pass silently and forever.
  # Example: - {name: "Microsoft 365", slot: mail, status: true, purpose: "Mailbox for the briefing"}
  connectors: []
    # - name: "Microsoft 365"
    #   purpose: "Mail and calendar"
    #   status: true
    # - name: "SharePoint"
    #   purpose: "File storage"
    #   status: false

  # Command-line tools. Installation: reference/tools.md
  clis: []
    # - name: "firecrawl"
    #   purpose: "Read web pages and search the web"
    #   status: true
    # - name: "playwright"
    #   purpose: "Real browser: logins, forms, screenshots"
    #   status: false

  # Installed Claude Code plugins. Recommendations: reference/plugins.md
  plugins: []
    # - name: "skill-creator"
    #   purpose: "Build new skills and improve existing ones"
    #   status: true

  # Services with their own access. The keys themselves NEVER live here, they live in
  # ~/.config/credentials.env — here it only says what the entry over there is called.
  # status is not typed, it is derived from the existence of the key.
  accounts: []
    # - name: "Firecrawl"
    #   purpose: "Read web pages and search the web"
    #   key_env: "FIRECRAWL_API_KEY"
    #   status: true
    # - name: "OpenRouter"
    #   purpose: "Generate images and use specialist models"
    #   key_env: "OPENROUTER_API_KEY"
    #   status: false

  # Git repos you work with. Project repos live in projects/<slug>/code/
  # and have their own history (see projects/README.md).
  repos: []
    # - name: "workspace"
    #   url: "https://github.com/example/workspace"
    # - name: "website"
    #   url: "https://github.com/example/website"
    #   path: "projects/website"

  # Scheduled runs, schedule in plain language. Instructions: SETUP.md
  routines: []
    # - name: "Morning briefing"
    #   schedule: "weekdays 7:00"

# Your own domains — separates internal from external (drives priority in the briefing)
company_domains: ["[your-company.com]"]   # enter all of your own domains, e.g. ["company.com", "company.de"]

# Absolute path to this workspace — computed by /setup, never typed by hand
workspace_root: ""

# What the user works with every day, in their own words — asked for by /setup (question 5).
# This is the starting point for connecting things: /setup step 7.2 works from these names instead of
# asking abstractly slot by slot. Entries stay in even when nothing could be connected — then the
# reason is the useful part. /checkup and /audit read this rather than asking again.
#   - name: "HubSpot"
#     purpose: "everything to do with customers, quotes and follow-ups"
tools_in_use: []

# One-time offers that must not repeat. A rule that says "ask this only once" needs a place
# to record that it happened, otherwise it fires on every run or never at all. Value is either
# an absolute date (asked on that day) or "declined" (never bring it up again).
#   automation: "2026-08-20"   # /checkup offered the automation analysis
asked: {}

# Claude plan — asked for by /setup: "pro" (20 €), "max5" (100 €), "max20" (200 €), "team" or empty.
# Determines the main model in .claude/settings.json (Pro = always sonnet, otherwise a choice) and is the
# early warning before big runs: on "pro" a five-agent run burns through the quota in one go.
plan: ""

# Operating system — detected by /setup ("windows" or "mac").
# Drives draft mechanics (PowerShell COM vs. AppleScript) and how the dashboard opens.
os: ""

# What the dashboard fill script starts with — determined by /setup ("node", "uv run python", "python3" or "python").
# Node is the default (ships with Claude Code), Python is only a fallback.
# Empty = no runtime found; then no dashboard is created, the briefing in the chat still runs.
script_command: ""

# How mail drafts are created — determined by /setup:
# "mcp" (connector has a draft tool), "com" (Windows default, Outlook), "mailto" (Mac default, needs no permissions),
# "applescript" (Mac, opt-in), "manual" (none of these work — the text lands in the chat).
# Empty = /email walks the ladder itself (MCP tool? → otherwise OS default: Windows "com", Mac "mailto").
draft_method: ""
